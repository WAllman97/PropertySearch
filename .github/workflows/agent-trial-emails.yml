name: Agent Trial Emails

on:
  schedule:
    - cron: "0 9 * * *" # daily, 9am UTC; "4 days left", "last day tomorrow", "trial has ended"
  workflow_dispatch:

# One run at a time: a slow run finishes before the next starts, instead of
# two runs sending the same emails side by side.
concurrency:
  group: agent-trial-emails
  cancel-in-progress: false

jobs:
  send-trial-emails:
    runs-on: ubuntu-latest
    # A hung email or API call can't hold the job for GitHub's 6-hour default.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send agent trial emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          # Optional booking page for "Book a call" (repo → Settings → Variables).
          CALL_BOOKING_URL: ${{ vars.CALL_BOOKING_URL }}
        run: python jobs/agent_trial_emails.py
