name: Nightly Backup

# Every night: a copy of the database (all app tables, plus logins) and every
# uploaded file, encrypted with BACKUP_PASSPHRASE and kept here as a workflow
# artifact for 30 days. Supabase's free plan keeps no backups of its own.
# How to restore: docs/BACKUPS.md.
#
# Secrets: SUPABASE_DB_URL (the "Session pooler" connection string, with the
# database password in it), BACKUP_PASSPHRASE, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY. GitHub emails you if a run fails.

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Add the SUPABASE_DB_URL secret (see docs/BACKUPS.md)"; missing=1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Add the BACKUP_PASSPHRASE secret (see docs/BACKUPS.md)"; missing=1; }
          # Check the connection string's shape without ever printing it.
          url="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          case "$url" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must be the whole connection string, starting postgresql:// (not just the password)"; missing=1 ;;
          esac
          case "$url" in
            *pooler.supabase.com:5432/*) ;;
            *) echo "::error::SUPABASE_DB_URL must be the Session pooler string (…pooler.supabase.com:5432/postgres)"; missing=1 ;;
          esac
          case "$url" in
            *'['*|*']'*) echo "::error::SUPABASE_DB_URL still has [ or ]: replace [YOUR-PASSWORD], brackets included, with the password"; missing=1 ;;
          esac
          case "$url" in
            *postgres.*:*@*) ;;
            *) echo "::error::SUPABASE_DB_URL's user should be postgres.<project id>, followed by :password@"; missing=1 ;;
          esac
          exit $missing

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          SUPABASE_DB_URL="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          # pg_dump 17 reads any older Postgres. Two dumps, because pg_dump
          # ignores --schema once --table is given: the whole app schema
          # (tables, data, functions, policies), then the logins
          # (auth.users, auth.identities) and the file index (storage).
          docker run --rm -e PGURL="$SUPABASE_DB_URL" -v "$PWD/backup:/out" postgres:17 sh -c '
            set -e
            pg_dump "$PGURL" --format=custom --no-owner --schema=public --file=/out/database.dump
            pg_dump "$PGURL" --format=custom --no-owner \
              --table=auth.users --table=auth.identities \
              --table=storage.buckets --table=storage.objects \
              --file=/out/logins-and-files-index.dump
            pg_restore --list /out/database.dump > /out/contents.txt
            pg_restore --list /out/logins-and-files-index.dump >> /out/contents.txt
          '
          tables=$(grep -c "TABLE DATA public" backup/contents.txt || true)
          logins=$(grep -c "TABLE DATA auth users" backup/contents.txt || true)
          [ "$logins" -ge 1 ] || { echo "::error::The logins (auth.users) are missing from the backup."; exit 1; }
          echo "App tables with data: $tables"
          ls -la backup
          if [ "$tables" -lt 20 ]; then
            echo "::error::The dump looks incomplete ($tables app tables)."
            exit 1
          fi

      - name: Download uploaded files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/jobs/backup_storage_files.py backup/files

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tar -czf - -C backup . | gpg --batch --yes --pinentry-mode loopback \
            --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
            --output "viewpal-backup-$stamp.tar.gz.gpg"
          rm -rf backup
          ls -la viewpal-backup-*.gpg
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.STAMP }}
          path: viewpal-backup-*.tar.gz.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
