name: Monthly Value Report

# The monthly "what ViewPal did for you" email to each agent branch
# (migration 040, frontend/api/_lib/monthly-report.js). The site does the
# work; this only starts it and keeps calling while branches remain (each
# call works for a few seconds). The 2nd and 3rd are catch-up runs: a branch
# already done is never emailed twice.
#
# No secret: each call carries a short-lived token GitHub signs for this
# workflow (OpenID Connect, "id-token: write" below). The site checks it is
# from this repository, this file and the main branch
# (frontend/api/_lib/github-oidc.js). APP_URL is an optional repo variable
# (defaults to https://viewpal.app).

on:
  schedule:
    - cron: "0 8 1-3 * *" # 8am UTC on the 1st, 2nd and 3rd
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report on, YYYY-MM (blank = last month)"
        required: false

# Only what's needed: ask GitHub for the signed token. No repo access.
permissions:
  id-token: write

concurrency:
  group: monthly-value-report
  cancel-in-progress: false

jobs:
  send-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Send monthly reports
        env:
          APP_URL: ${{ vars.APP_URL }}
          MONTH: ${{ github.event.inputs.month }}
        run: |
          set -euo pipefail
          # A fresh token for each call (they last a few minutes).
          github_token() {
            curl -sS --fail -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=viewpal-monthly-report" | jq -r '.value'
          }
          url="${APP_URL:-https://viewpal.app}"
          url="${url%/}/api/agent-signup"
          body=$(jq -nc --arg month "${MONTH:-}" '{action: "monthly_report_run"} + (if $month == "" then {} else {month: $month} end)')
          for attempt in $(seq 1 60); do
            token=$(github_token)
            result=$(curl -sS --fail-with-body --max-time 60 -X POST "$url" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${token}" \
              -d "$body")
            echo "$result"
            remaining=$(echo "$result" | jq -r '.remaining')
            done_now=$(echo "$result" | jq -r '.done')
            if [ "$remaining" = "0" ]; then exit 0; fi
            # Nothing done but some left: another run (or a dead one) holds
            # them. Tomorrow's catch-up run takes over claims older than 30 min.
            if [ "$done_now" = "0" ]; then
              echo "Some branches are claimed elsewhere; tomorrow's run picks them up."
              exit 0
            fi
          done
          echo "Still branches left after 60 calls"; exit 1
