name: iPhone app to TestFlight

# Builds the iPhone app on a GitHub Mac and uploads it to TestFlight.
# Run it by hand: GitHub → Actions → "iPhone app to TestFlight" → Run workflow.
# (Manual only, because Mac build minutes are limited.)
#
# Signing is Apple's cloud-managed signing via an App Store Connect API key,
# the same automatic signing Xcode uses on a Mac, so building here and on
# your own Mac don't get in each other's way. See docs/IOS_APP.md.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY       (already there for the scraper)
#   APNS_TEAM_ID                          (your Apple Team ID; already there for push)
#   APP_STORE_CONNECT_KEY                 (whole .p8 file contents)
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
# Optional variables (same page, "Variables" tab):
#   CONTACT_EMAIL, PUBLIC_SITE_URL, MAP_TILE_URL, MAP_ATTRIBUTION
#
# Without the App Store Connect secrets it still runs, as an unsigned
# "does it build?" check, and uploads nothing.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (untick to only check it builds)"
        type: boolean
        default: true
      check_only:
        description: "Only check it compiles (no signing; works before an iPhone is registered)"
        type: boolean
        default: false

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    env:
      PROJECT: ios/App/App.xcodeproj
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APNS_TEAM_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Build the web app and copy it into the iOS project
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          VITE_MAP_TILE_URL: ${{ vars.MAP_TILE_URL }}
          VITE_MAP_ATTRIBUTION: ${{ vars.MAP_ATTRIBUTION }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are missing"; exit 1
          fi
          npx vite build
          npx cap sync ios

      - name: Decide whether we can sign
        id: mode
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            echo "Compile check only: no signing, nothing uploaded."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$ASC_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$TEAM_ID" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::App Store Connect key not set up: unsigned build check only, nothing uploaded."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          # Build number: date and time (UTC), e.g. 261119.1430. Always goes
          # up, so builds from here and from your Mac never clash.
          echo "BUILD_NUMBER=$(date -u +%y%m%d.%H%M)" >> "$GITHUB_ENV"

      - name: Unsigned build check
        if: steps.mode.outputs.signed != 'true'
        run: |
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet build

      - name: Archive (signed)
        if: steps.mode.outputs.signed == 'true'
        run: |
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet archive

      - name: Upload to TestFlight
        if: steps.mode.outputs.signed == 'true'
        run: |
          DESTINATION=upload
          if [ "${{ inputs.upload }}" != "true" ]; then DESTINATION=export; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Build $BUILD_NUMBER $([ "$DESTINATION" = upload ] && echo 'uploaded: it appears in App Store Connect → TestFlight in 10–30 minutes' || echo 'built, not uploaded')" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
